<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content">
    <link rel="icon" type="image/png" href="static/favicon.png">
    <title>Kiwi IRC</title>
    <style>
        html,
        body {
            /* disable the 'pull down to refresh' on mobiles */
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        .kiwi-preload {
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: center;
            align-items: center;
            font-family: 'Source Sans Pro', Helvetica, sans-serif;
        }
        .kiwi-preload > div {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 48px;
            font-weight: 900;
        }
        .kiwi-preload > noscript {
            text-align: center;
            font-weight: bold;
            padding: 1em;
        }
        @media (prefers-color-scheme: dark) {
            .kiwi-preload {
                background-color: #3c3c3c;
                color: #ffffff;
            }
        }
    </style>
    <style class="embedly-css">
        .card .hdr,
        .card .action,
        .card .brd {
            display: none;
        }
        .card .txt-bd {
            padding: 4px 0 0 0;
        }
    </style>
    <script>window.startupTime = Date.now()</script>
<% for (let index in htmlWebpackPlugin.files.css) { %>
    <link rel="stylesheet" href="<%= htmlWebpackPlugin.files.css[index] %>" /><% } %>
<% for (let index in htmlWebpackPlugin.files.js) { %>
    <script defer src="<%= htmlWebpackPlugin.files.js[index] %>"></script><% } %>
</head>
<body>
    <div id="kiwiirc">
        <div class="kiwi-preload">
            <div>
                <img src="static/favicon.png">
                <span>Kiwi IRC</span>
            </div>
            <noscript>
                Please enable JavaScript and refresh the page to use this website.
            </noscript>
        </div>
    </div>
</body>
</html>
