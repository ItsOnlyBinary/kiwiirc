name: Run Tests

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
            node-version: '20.x'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn up @kiwiirc/eslint-plugin@./build/plugins/eslint-rules

      - name: Install dependencies
        run: yarn --immutable

      - name: Test
        run: yarn test

      - name: Lint
        run: yarn lint
